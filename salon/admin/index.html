<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>サロン LINE コンシェルジュ / 管理画面</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">サロン LINE コンシェルジュ</div>
      <div class="topbar-right">
        <span id="who" class="who"></span>
        <button id="logout" class="ghost" hidden>ログアウト</button>
      </div>
    </header>

    <main id="main">
      <!-- 未ログイン -->
      <section id="auth" class="card auth" hidden>
        <div class="tabs">
          <button class="tab is-active" data-mode="login">ログイン</button>
          <button class="tab" data-mode="signup">はじめて使う</button>
        </div>

        <label class="field" id="salon-name-field" hidden>
          <span>サロン名</span>
          <input id="salon-name" type="text" placeholder="サロン ルミエール" autocomplete="organization" />
        </label>
        <label class="field">
          <span>メールアドレス</span>
          <input id="email" type="email" autocomplete="email" />
        </label>
        <label class="field">
          <span>パスワード（8文字以上）</span>
          <input id="password" type="password" autocomplete="current-password" />
        </label>

        <details class="api-config">
          <summary>接続先の設定</summary>
          <label class="field">
            <span>API の URL</span>
            <input id="api-base" type="url" placeholder="https://salon-line-concierge.example.workers.dev" />
          </label>
        </details>

        <button id="auth-submit" class="primary">ログイン</button>
        <p id="auth-error" class="error" hidden></p>
      </section>

      <!-- ログイン後 -->
      <section id="app" hidden>
        <div class="grid">
          <article class="card">
            <h2>今月の AI 自動応答</h2>
            <p class="quota-number"><strong id="quota-used">0</strong> <span id="quota-total">/ 300 件</span></p>
            <div class="meter"><div id="quota-bar" class="meter-fill"></div></div>
            <p class="hint" id="quota-hint">上限に達すると自動応答は止まり、スタッフグループへの転送だけが続きます。</p>
          </article>

          <article class="card">
            <h2>LINE 連携</h2>
            <p id="line-status" class="status">未接続</p>
            <label class="field">
              <span>Webhook URL（LINE Developers に貼り付け）</span>
              <input id="webhook-url" type="text" readonly />
            </label>
            <button id="copy-webhook" class="ghost">URL をコピー</button>
          </article>
        </div>

        <article class="card">
          <h2>LINE チャネル情報</h2>
          <p class="hint">LINE Developers の「チャネル基本設定」と「Messaging API 設定」から取得できます。保存すると暗号化され、画面には二度と表示されません。</p>
          <label class="field">
            <span>チャネルシークレット</span>
            <input id="channel-secret" type="password" autocomplete="off" />
          </label>
          <label class="field">
            <span>チャネルアクセストークン（長期）</span>
            <input id="access-token" type="password" autocomplete="off" />
          </label>
          <label class="field">
            <span>ボットのユーザー ID（任意）</span>
            <input id="bot-user-id" type="text" placeholder="U1234..." />
          </label>
          <button id="save-line" class="primary">LINE 連携を保存</button>
        </article>

        <article class="card">
          <h2>応答の設定</h2>
          <label class="field">
            <span>サロン名</span>
            <input id="s-name" type="text" />
          </label>
          <label class="field">
            <span>スタッフグループの ID（転送先）</span>
            <input id="s-group" type="text" placeholder="Cxxxxxxxx" />
          </label>
          <label class="field">
            <span>営業時間</span>
            <textarea id="s-hours" rows="2" placeholder="火〜日 10:00-19:00（月曜定休）"></textarea>
          </label>
          <label class="field">
            <span>メニュー・料金</span>
            <textarea id="s-menu" rows="5" placeholder="フェイシャル 60分 8,800円&#10;まつげエクステ 120本 6,600円"></textarea>
          </label>
          <label class="field">
            <span>よくある質問</span>
            <textarea id="s-faq" rows="5" placeholder="駐車場は店舗前に2台あります"></textarea>
          </label>
          <label class="field">
            <span>NG ワード（1行に1つ。含まれたら AI は答えずスタッフに回します）</span>
            <textarea id="s-ng" rows="3" placeholder="返金&#10;クレーム"></textarea>
          </label>
          <div class="switches">
            <label class="switch"><input id="s-ai" type="checkbox" /> AI 自動応答を使う</label>
            <label class="switch"><input id="s-forward" type="checkbox" /> スタッフグループへ転送する</label>
          </div>
          <button id="save-settings" class="primary">設定を保存</button>
        </article>

        <article class="card">
          <h2>お客様</h2>
          <div class="split">
            <ul id="customers" class="list"></ul>
            <div id="thread" class="thread"><p class="hint">左の一覧からお客様を選ぶと会話が表示されます。</p></div>
          </div>
        </article>

        <p id="app-message" class="toast" hidden></p>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
